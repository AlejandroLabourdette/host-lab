[project]
name = "hostlab"
version = "0.1.0"
description = "Shared machinery that interprets a declarative per-title game server manifest"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

# The package is hostlab, not platform, because platform is a standard library
# module and a top-level package of that name shadows it. See ADR 0008.
[project.scripts]
hostlab = "hostlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "RUF",       # ruff's own
    "ANN",       # annotations, because mypy strict needs them anyway
    "S",         # bandit: this code runs subprocesses and talks to the internet
    "PTH",       # pathlib over os.path
    "RET", "ARG", "C4", "DTZ", "EM", "ISC", "PIE", "T20",
]
ignore = [
    # The platform shells out to docker and restic by design (ADR 0008), with
    # fixed argument lists and never through a shell. S603 flags every such
    # call; the rule that actually matters here, S602 (shell=True), stays on.
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, print, and hardcode passwords. That is what tests do: the
# password rules are the most-tested logic here, and testing them requires
# writing passwords down.
# S607 as well: tests invoke "docker" from PATH, which is how it is installed
# and how every other caller of it here finds it.
"tests/**" = ["S101", "S105", "S106", "S107", "S607", "ANN", "T20"]
# A command line prints. That is its entire job, and routing it through a
# logger would put the platform's refusals somewhere the operator is not
# looking.
"hostlab/cli.py" = ["T20"]
"hostlab/schema.py" = ["T20"]
# The agent's log IS stdout: that is where `docker logs` collects it, and ADR
# 0008 chose this shape over cron precisely because a cron job writes to a log
# nobody reads. Routing it through a logger would put it somewhere else.
"hostlab/agent.py" = ["T20"]
# The prover is deliberately stdlib-only and 3.9-compatible so it runs on
# whatever Python is to hand during a network problem. See ADR 0008.
"tools/**" = ["ANN", "T20", "UP", "EM", "PTH", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["hostlab", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "docker: needs a running Docker daemon. Skipped automatically when there is not one",
]
